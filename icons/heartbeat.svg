<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg_heartbeat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8080" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#DC143C" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow_heartbeat" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#FFA07A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#DC143C" stop-opacity="0"/>
    </radialGradient>
    
  </defs>
  <!-- Background glow -->
  <circle cx="256" cy="256" r="240" fill="url(#bg_heartbeat)"/>
  <!-- Inner glow -->
  <ellipse cx="256" cy="230" rx="180" ry="160" fill="url(#glow_heartbeat)" opacity="0.6"/>
  
  <!-- Heart -->
  <path d="M256 400 C256 400 90 290 90 190 C90 140 130 100 175 100 
           C220 100 245 135 256 165 C267 135 292 100 337 100 
           C382 100 422 140 422 190 C422 290 256 400 256 400Z"
        fill="#DC143C" opacity="0.35" stroke="#FFA07A" stroke-width="3"/>
  <!-- ECG line across heart -->
  <path d="M100 240 L170 240 L190 240 L210 200 L230 280 L250 160 L270 300 L290 220 L310 240 L412 240"
        stroke="#FFA07A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Pulse rings -->
  <circle cx="256" cy="240" r="60" fill="none" stroke="#FF8080" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="240" r="90" fill="none" stroke="#FF8080" stroke-width="1.5" opacity="0.2"/>
  <circle cx="256" cy="240" r="120" fill="none" stroke="#FF8080" stroke-width="1" opacity="0.1"/>
  <!-- Shine -->
  <ellipse cx="195" cy="165" rx="25" ry="18" fill="white" opacity="0.1" transform="rotate(-25 195 165)"/>
  <circle cx="369.1" cy="243.8" r="4.2" fill="#FF8080" opacity="0.65"/>
  <circle cx="312.7" cy="330.8" r="2.7" fill="#FF8080" opacity="0.66"/>
  <circle cx="263.0" cy="332.2" r="5.3" fill="#FF8080" opacity="0.41"/>
  <circle cx="149.0" cy="316.5" r="2.5" fill="#FF8080" opacity="0.47"/>
  <circle cx="128.1" cy="219.6" r="3.0" fill="#FF8080" opacity="0.32"/>
  <circle cx="190.4" cy="196.9" r="3.1" fill="#FF8080" opacity="0.70"/>
  <circle cx="268.1" cy="171.7" r="5.7" fill="#FF8080" opacity="0.59"/>
  <circle cx="289.2" cy="179.4" r="2.2" fill="#FF8080" opacity="0.57"/>
</svg>