<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background gradient: deep navy, slightly lighter at top for ambient light -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3F4B6F"/>
      <stop offset="100%" stop-color="#2C344E"/>
    </linearGradient>
    <!-- Ambient glow: radial gold halo behind the globe -->
    <radialGradient id="ambient" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#E8B84A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#E8B84A" stop-opacity="0"/>
    </radialGradient>
    <!-- 3-stop gold gradient for the globe lines + monogram -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE680"/>
      <stop offset="50%" stop-color="#E8B84A"/>
      <stop offset="100%" stop-color="#C99428"/>
    </linearGradient>
    <!-- Soft white-to-transparent for the specular highlight -->
    <radialGradient id="spec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Heart pink gradient (subtle, in case the user wants the heart accent back later) -->
    <radialGradient id="heart" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF8FA8"/>
      <stop offset="100%" stop-color="#E06080"/>
    </radialGradient>
  </defs>

  <!-- 1. Rounded square background -->
  <rect width="100" height="100" rx="18" fill="url(#bgGrad)"/>

  <!-- 2. Ambient gold glow behind the globe -->
  <rect width="100" height="100" rx="18" fill="url(#ambient)"/>

  <!-- 3. Wireframe globe (4 layers: outer circle + 2 ellipses + equator line) -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="50" r="34" stroke-width="2.2"/>
    <ellipse cx="50" cy="50" rx="34" ry="13" stroke-width="1.8"/>
    <ellipse cx="50" cy="50" rx="13" ry="34" stroke-width="1.8"/>
    <line x1="16" y1="50" x2="84" y2="50" stroke-width="1.5"/>
  </g>

  <!-- 4. Specular highlight on the globe (top-left, suggests material lighting) -->
  <ellipse cx="38" cy="36" rx="16" ry="6" fill="url(#spec)" transform="rotate(-30 38 36)"/>

  <!-- 5. R&E monogram in center (Inter, bold, with gold gradient) -->
  <text x="50" y="58" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="24" font-weight="700" letter-spacing="-1.2"
        fill="url(#gold)">R&amp;E</text>

  <!-- 6. Tiny heart accent (low-opacity, scales the brand into "couple" territory) -->
  <path d="M50 72 C47.5 69.5 43 67.5 43 64.5 A2.8 2.8 0 0 1 48 63 A2.8 2.8 0 0 1 50 64.5 A2.8 2.8 0 0 1 52 63 A2.8 2.8 0 0 1 57 64.5 C57 67.5 52.5 69.5 50 72 Z"
        fill="url(#heart)" opacity="0.85"/>

  <!-- 7. Inner border (subtle, gives the favicon a "badge" feel at small sizes) -->
  <rect x="1" y="1" width="98" height="98" rx="17" fill="none"
        stroke="url(#gold)" stroke-width="0.6" opacity="0.4"/>
</svg>
